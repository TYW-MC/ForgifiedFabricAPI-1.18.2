name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: >
          ./gradlew build --no-daemon --stacktrace
          -x test
          -x compileTestmodJava
          -x javadoc
          -x remapSourcesJar
          -x sourcesJar
          -x validateAnnotations
          -x runDatagen
          -x checkReferenceCompatibility
          -x validateMixinNames
          -x validateAccessWidener

      - name: Collect release jars
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar) continue ;;
              *-testmod.jar) continue ;;
              *fatjavadoc.jar) continue ;;
            esac
            cp "$f" dist/
          done
          echo "Release assets:"
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Forgified Fabric API ${{ github.ref_name }}
          body: |
            A **Forge 1.18.2 port of the Fabric API**, packaged so that Fabric mods can run on
            Forge through [Sinytra Connector](https://github.com/TYW-MC/Connector-1.18.2).

            Drop this jar into your `mods/` folder together with Connector and the Fabric mods
            you want to run.

            ## Compatibility

            | | |
            | --- | --- |
            | Minecraft | 1.18.2 |
            | Forge | 40.3.12 or newer |
            | Java | 17 |
            | Requires | Sinytra Connector 1.18.2 |

            ## What's inside

            The full Fabric API module set, built for 1.18.2: resource loader, registry sync,
            networking, transfer API, item groups, loot API, mining level, content registries,
            and the supporting implementation modules.

            ## Changes in this build

            - **Render layer registration no longer aborts startup on Embeddium/Rubidium
              setups.** The previous build forwarded Fabric's registrations to Forge's
              `RenderLayers.setRenderLayer` directly from `RenderLayers`' static initialiser.
              Under Sinytra Connector a Fabric mod can reach that initialiser from its client
              entrypoint, which runs from `Main#main` *before* the Minecraft client object
              exists - and Embeddium mixes into `setRenderLayer` and its callback calls
              `Minecraft.getInstance().execute(...)`, so the call threw a
              `NullPointerException`. Thrown inside a class initialiser, that NPE turned into an
              `ExceptionInInitializerError`, the connector reported `Could not execute entrypoint
              stage 'client' ... provided by 'mishanguc'` and the game died while booting.
              Registrations are now parked and applied from the client's first tick (a new
              `MinecraftClient.tick` hook), which is after the client instance exists and long
              before anything is rendered. Registrations made later still go straight through.

            - **Render layers registered by Fabric mods now reach the optimisation mods
              (Embeddium/Rubidium).** Forge keeps block render layers in two places: the vanilla
              `BLOCKS`/`FLUIDS` maps, and a second, predicate-shaped map (`blockRenderChecks`,
              reachable through `ItemBlockRenderTypes.canRenderInLayer`) that Forge derives from
              the vanilla maps *once*, inside its own static initialiser, and then never
              regenerates. Fabric API's `BlockRenderLayerMap` only wrote the vanilla maps, so a
              block registered as cutout or translucent was invisible to the predicate map and
              got its default predicate instead, which accepts the solid layer only. Vanilla's
              chunk builder reads the vanilla maps and so was unaffected, but Embeddium and
              Rubidium ask Forge - `EmbeddiumRenderLayerCache` builds a state's render type list
              out of `canRenderInLayer` - and therefore rendered those blocks as **solid**: the
              alpha channel of their textures was ignored and the transparent pixels were drawn
              in their own colour. For textures whose transparent pixels are pure black (yellow
              road lines) or near-white (white road lines) that meant solid black or white faces
              in the world, while the item icon in the inventory looked fine. `putBlock`,
              `putFluid` and `putItem` now also forward every entry to
              `RenderLayers.setRenderLayer`, the Forge API that maintains the predicate map and
              republishes its read-only view, so both maps stay in sync.

            ## Also in this line

            - **Creative inventory tabs no longer overlap.** The ported `item-groups-v0` module
              still carried Fabric's own tab-layout mixin, which rewrote `isTopRow()` and
              `getColumn()` with the `(index - 12) % 9` formula Fabric uses on top of *its*
              creative screen. Forge 1.18.2 already paginates the creative tabs natively
              (`((index - 12) % 10) % 5`, ten mod tabs per page), so the two formulas fought
              each other: from the eleventh mod tab onwards, tabs wrapped back into a slot an
              earlier mod had already claimed and were drawn on top of one another. The mixin no
              longer injects anything and tab placement is left entirely to Forge.

            - **Every mixin configuration declares `minVersion: 0.8`.** The mixin configs
              shipped by the port were missing the field, which Mixin reports as an error for
              each config it loads, so a normal startup log was full of noise. All of them are
              annotated now and the corresponding errors are gone.

            - **Two mixin configs carried a trailing comma** left over from the porting pass,
              which made them invalid JSON and could stop the affected modules from applying.
              Both have been fixed.

            - **The main menu panorama and sounds no longer disappear.** Sinytra Connector
              exposes the vanilla game and Forge as ordinary Fabric mods, and their game jars
              only ship 1x1 stub copies of a handful of assets - among them the title screen
              panoramas. Those stubs used to be bundled into the always-on-top `Fabric Mods`
              pack, which shadowed the real assets served by the asset-index-backed default
              pack. The result was a flat grey main menu background and no music. Resource packs
              are now skipped for game/platform mods: either the `minecraft` mod id, or any mod
              whose root paths contain the `assets/.mcassetsroot` (or `data/.mcassetsroot`)
              marker.

            ## Installation

            1. Install Minecraft Forge 40.3.x for Minecraft 1.18.2.
            2. Put this jar and `Connector-1.18.2` into your `mods/` folder.
            3. Put any Fabric mods you want to use into the same folder.

            ## Building from source

            ```bash
            ./gradlew build
            ```

            Requires JDK 17. Builds run automatically on every push and on every release tag.
          files: dist/*.jar
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
